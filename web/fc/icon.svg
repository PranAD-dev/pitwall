<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#132033"/>
      <stop offset="0.55" stop-color="#0a1120"/>
      <stop offset="1" stop-color="#05080f"/>
    </linearGradient>
    <linearGradient id="turf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f7d4a"/>
      <stop offset="1" stop-color="#1d5330"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.34" r="0.62">
      <stop offset="0" stop-color="#ffe9a8" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe07a"/>
      <stop offset="1" stop-color="#e0a521"/>
    </linearGradient>
  </defs>

  <!-- plate -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- pitch band with mowing stripes, clipped to the plate -->
  <clipPath id="plate"><rect width="512" height="512" rx="112"/></clipPath>
  <g clip-path="url(#plate)">
    <rect y="150" width="512" height="245" fill="url(#turf)"/>
    <g opacity="0.16" fill="#ffffff">
      <rect x="40"  y="150" width="52" height="245"/>
      <rect x="144" y="150" width="52" height="245"/>
      <rect x="248" y="150" width="52" height="245"/>
      <rect x="352" y="150" width="52" height="245"/>
      <rect x="456" y="150" width="52" height="245"/>
    </g>
    <!-- halfway line + centre circle -->
    <rect x="252" y="150" width="8" height="245" fill="#ffffff" opacity="0.85"/>
    <circle cx="256" cy="272" r="86" fill="none" stroke="#ffffff" stroke-width="8" opacity="0.85"/>
    <rect width="512" height="512" fill="url(#glow)"/>
  </g>

  <!-- ball -->
  <g transform="translate(256 272)">
    <circle r="62" fill="#ffffff"/>
    <circle r="62" fill="none" stroke="#0b1120" stroke-width="5" opacity="0.35"/>
    <path d="M0 -30 L28.5 -9.3 L17.6 24.3 L-17.6 24.3 L-28.5 -9.3 Z" fill="#12182a"/>
    <path d="M0 -62 L0 -30 M28.5 -9.3 L59 -19 M17.6 24.3 L36 51 M-17.6 24.3 L-36 51 M-28.5 -9.3 L-59 -19"
          stroke="#12182a" stroke-width="9" stroke-linecap="round" fill="none"/>
  </g>

  <!-- gold star: the Acher cheat code -->
  <g transform="translate(388 140)">
    <path d="M0 -44 L12.9 -13.6 L45.8 -13.6 L19.4 6.6 L29.4 38 L0 18.6 L-29.4 38 L-19.4 6.6 L-45.8 -13.6 L-12.9 -13.6 Z"
          fill="url(#gold)"/>
  </g>

  <!-- wordmark -->
  <text x="256" y="446" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, system-ui, sans-serif"
        font-size="72" font-weight="800" letter-spacing="-1" fill="#f4f7fc">FIFAcher</text>
</svg>
