<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pran FC — FC Control 26</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Saira:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg0:#04070b; --ink:#eef3f7; --dim:#8591a0;
    --volt:#c6ff2e; --cyan:#3fe3ff;
    --turf:#2fe07a; --amber:#ffb23e; --red:#ff4d5e;
    --glass:rgba(13,19,27,.56); --glass2:rgba(16,23,32,.72); --brd:rgba(255,255,255,.08);
    --brd2:rgba(255,255,255,.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{background:var(--bg0);color:var(--ink);
       font-family:"Saira",system-ui,sans-serif;font-size:14px;overflow:hidden;}
  .mono{font-family:"JetBrains Mono",monospace;font-variant-numeric:tabular-nums;}
  .raj{font-family:"Rajdhani",sans-serif;text-transform:uppercase;letter-spacing:.04em;font-weight:600;}

  /* ---------- cinematic goalpost background ---------- */
  #bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:
      radial-gradient(95% 70% at 50% -6%, #11232e 0%, transparent 58%),
      linear-gradient(180deg,#04070b 0%,#06101a 48%,#08201a 100%);}
  #bg .floods{position:absolute;inset:0;background:
      radial-gradient(46% 42% at 28% -6%, rgba(198,255,46,.16), transparent 68%),
      radial-gradient(46% 42% at 72% -6%, rgba(63,227,255,.13), transparent 68%);}
  #bg svg{position:absolute;left:50%;top:5%;transform:translateX(-50%);
          width:min(1480px,98vw);height:auto;opacity:1;}
  #bg .vig{position:absolute;inset:0;background:
      radial-gradient(130% 100% at 50% 34%, transparent 58%, rgba(2,5,4,.78) 100%);}
  #bg .grain{position:absolute;inset:0;opacity:.35;mix-blend-mode:overlay;background-size:3px 3px;
      background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px);}

  /* ---------- shell ---------- */
  .wrap{position:relative;z-index:1;height:100vh;display:flex;flex-direction:column;padding:16px;gap:14px;}
  /* hero bar */
  .hero{display:flex;align-items:center;gap:18px;padding:14px 20px;border-radius:16px;
        background:linear-gradient(100deg,rgba(18,26,36,.78),rgba(10,16,22,.5));
        border:1px solid var(--brd);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
        box-shadow:0 10px 40px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.05);}
  .crest{width:42px;height:48px;flex:none;display:flex;align-items:center;justify-content:center;
         font-family:"Rajdhani";font-weight:700;font-size:24px;color:#0a1004;
         background:linear-gradient(165deg,var(--volt),#8fce00);
         clip-path:polygon(50% 0,100% 16%,100% 60%,50% 100%,0 60%,0 16%);
         box-shadow:0 0 24px rgba(198,255,46,.35);}
  .mark{line-height:1;}
  .mark .t{font-family:"Rajdhani";font-weight:700;font-size:23px;letter-spacing:.07em;}
  .mark .s{font-size:11px;letter-spacing:.32em;color:var(--volt);margin-top:4px;font-weight:600;}
  .stats{margin-left:auto;display:flex;gap:10px;}
  .stat{padding:8px 16px;border-radius:11px;background:rgba(255,255,255,.03);border:1px solid var(--brd);
        min-width:92px;}
  .stat .k{font-family:"Rajdhani";font-size:10.5px;letter-spacing:.14em;color:var(--dim);}
  .stat .v{font-family:"JetBrains Mono";font-weight:700;font-size:21px;margin-top:3px;line-height:1;}
  .stat .v small{font-family:"Saira";font-size:11px;color:var(--dim);font-weight:500;}
  .stat.hot .v{color:var(--red);} .stat.go .v{color:var(--volt);}
  .stat.cash .v{font-size:13px;white-space:nowrap;letter-spacing:-.02em;}
  .liv{display:flex;align-items:center;gap:8px;font-family:"Rajdhani";font-size:11px;letter-spacing:.16em;color:var(--dim);padding-left:6px;}
  .liv .d{width:9px;height:9px;border-radius:50%;background:var(--volt);box-shadow:0 0 10px var(--volt);animation:p 2s infinite;}
  @keyframes p{50%{opacity:.35;}}

  /* feed strip */
  .feed{display:flex;align-items:center;gap:14px;padding:9px 18px;border-radius:12px;
        background:var(--glass);border:1px solid var(--brd);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);overflow:hidden;}
  .feed .tag{font-family:"Rajdhani";font-weight:700;font-size:11px;letter-spacing:.14em;color:#0a1004;
             background:var(--volt);padding:3px 11px;border-radius:6px;white-space:nowrap;}
  .feed .track{flex:1;overflow:hidden;} .feed .run{display:inline-flex;gap:34px;white-space:nowrap;animation:scroll 40s linear infinite;}
  .feed:hover .run{animation-play-state:paused;}
  @keyframes scroll{to{transform:translateX(-50%);}}
  .tk b{font-family:"Rajdhani";letter-spacing:.03em;} .tk .g{color:var(--turf);} .tk .a{color:var(--amber);} .tk .r{color:var(--red);} .tk .sub{color:var(--dim);}

  /* grid of glass panels */
  .grid{flex:1;display:grid;grid-template-columns:340px 300px 1fr;gap:14px;min-height:0;}
  .panel{border-radius:16px;background:var(--glass);border:1px solid var(--brd);
         backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);display:flex;flex-direction:column;min-height:0;
         box-shadow:0 10px 40px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.04);}
  .ph{font-family:"Rajdhani";font-size:12.5px;letter-spacing:.14em;padding:15px 18px 12px;
      display:flex;justify-content:space-between;border-bottom:1px solid var(--brd);}
  .ph .n{color:var(--volt);} .scroll{overflow:auto;padding:8px;}

  /* squad cards (queue) */
  .card{display:flex;gap:12px;align-items:center;padding:11px 12px;border-radius:12px;cursor:pointer;
        border:1px solid transparent;transition:.14s;margin-bottom:6px;}
  .card:hover{background:rgba(255,255,255,.04);border-color:var(--brd);}
  .card.active{background:linear-gradient(100deg,rgba(198,255,46,.1),rgba(255,255,255,.02));
               border-color:rgba(198,255,46,.4);box-shadow:0 0 22px rgba(198,255,46,.12);}
  .num{width:40px;height:46px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;
       font-family:"Rajdhani";background:linear-gradient(165deg,rgba(255,255,255,.08),rgba(255,255,255,.02));
       border:1px solid var(--brd2);clip-path:polygon(50% 0,100% 18%,100% 70%,50% 100%,0 70%,0 18%);}
  .num .no{font-weight:700;font-size:17px;line-height:1;} .num .ps{font-size:8.5px;letter-spacing:.1em;color:var(--dim);margin-top:1px;}
  .card .body{flex:1;min-width:0;}
  .card .id{font-family:"JetBrains Mono";font-size:12.5px;}
  .card .meta{color:var(--dim);font-size:12px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .card .rt{text-align:right;} .card .amt{font-family:"JetBrains Mono";font-size:12.5px;margin-top:5px;}
  .chip{font-family:"Rajdhani";font-size:10px;font-weight:700;letter-spacing:.07em;padding:3px 9px;border-radius:6px;white-space:nowrap;}
  .c-NEW{background:rgba(255,255,255,.07);color:#aeb9c6;} .c-PROPOSED{background:rgba(63,227,255,.14);color:var(--cyan);}
  .c-NEEDS_INFO{background:rgba(255,178,62,.16);color:var(--amber);} .c-APPROVED{background:rgba(47,224,122,.16);color:var(--turf);}
  .c-POSTED{background:rgba(47,224,122,.16);color:var(--turf);} .c-HELD{background:rgba(255,77,94,.16);color:var(--red);}
  .c-REJECTED{background:rgba(255,77,94,.14);color:#ff8a95;}

  /* dugout buttons */
  .play{display:block;width:100%;text-align:left;border-radius:13px;padding:14px 15px;cursor:pointer;margin-bottom:11px;
        background:linear-gradient(150deg,rgba(255,255,255,.05),rgba(255,255,255,.015));
        border:1px solid var(--brd);color:var(--ink);font-family:inherit;transition:.15s;position:relative;overflow:hidden;}
  .play::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--brd2);}
  .play:hover{border-color:var(--brd2);transform:translateY(-1px);box-shadow:0 8px 24px rgba(0,0,0,.35);}
  .play .bt{font-family:"Rajdhani";font-size:15px;letter-spacing:.03em;font-weight:600;}
  .play .bd{color:var(--dim);font-size:12px;margin-top:4px;}
  .play.volt::after{background:var(--volt);} .play.volt:hover{box-shadow:0 0 26px rgba(198,255,46,.18);}
  .play.red::after{background:var(--red);} .play.red:hover{box-shadow:0 0 26px rgba(255,77,94,.18);border-color:rgba(255,77,94,.4);}
  .play.amber::after{background:var(--amber);} .play.amber:hover{box-shadow:0 0 26px rgba(255,178,62,.15);}
  .play:disabled{opacity:.5;cursor:default;transform:none;}
  .squad{font-size:12px;color:var(--dim);line-height:1.9;padding:2px;}
  .squad b{color:var(--ink);font-family:"Rajdhani";font-weight:600;letter-spacing:.02em;}

  /* review (VAR) */
  .rev{padding:20px 24px;}
  .badge{display:inline-flex;align-items:center;gap:8px;font-family:"Rajdhani";font-size:11px;letter-spacing:.2em;
         color:var(--volt);border:1px solid rgba(198,255,46,.3);background:rgba(198,255,46,.06);padding:5px 13px;border-radius:8px;}
  .rtitle{font-family:"Rajdhani";font-weight:700;font-size:26px;letter-spacing:.02em;margin:14px 0 2px;}
  .rhead{color:var(--volt);font-size:14px;margin-bottom:18px;max-width:64ch;}
  .lab{font-family:"Rajdhani";font-size:11px;letter-spacing:.14em;color:var(--dim);margin:22px 0 11px;padding-bottom:7px;border-bottom:1px solid var(--brd);}
  .step{display:flex;gap:12px;align-items:baseline;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.05);opacity:0;transform:translateX(-6px);transition:.26s;}
  .step.show{opacity:1;transform:none;}
  .rc{width:13px;height:18px;border-radius:3px;flex:none;transform:rotate(-7deg);box-shadow:0 2px 8px rgba(0,0,0,.5);}
  .rc-green{background:var(--turf);box-shadow:0 0 10px rgba(47,224,122,.4);} .rc-amber{background:var(--amber);} .rc-red{background:var(--red);box-shadow:0 0 10px rgba(255,77,94,.4);}
  .step .ac{font-family:"Rajdhani";letter-spacing:.02em;min-width:168px;font-weight:600;} .step .st{color:var(--dim);font-size:13px;}
  .scene{padding:12px 0;border-bottom:1px solid rgba(255,255,255,.05);opacity:0;transform:translateY(5px);transition:.26s;}
  .scene.show{opacity:1;transform:none;}
  .scene .say{font-size:15px;} .scene .say::before{content:"▸ ";color:var(--volt);}
  .scene .facts{font-family:"JetBrains Mono";color:var(--dim);font-size:12px;margin-top:5px;}
  .aud{display:flex;gap:11px;align-items:baseline;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.05);opacity:0;transition:.22s;}
  .aud.show{opacity:1;} .aud .t{font-family:"JetBrains Mono";color:var(--dim);font-size:12px;min-width:62px;}
  .aud .who{font-family:"Rajdhani";letter-spacing:.02em;min-width:140px;font-weight:600;}
  .aud .did{font-size:13px;} .aud .did.deny{color:var(--red);} .aud .did.ok{color:var(--turf);} .aud .rsn{color:var(--dim);font-size:12.5px;}
  .empty{color:var(--dim);text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;
         min-height:50vh;line-height:1.9;font-size:14.5px;}
  .empty .big{font-family:"Rajdhani";font-weight:700;font-size:20px;letter-spacing:.04em;color:var(--ink);margin-bottom:10px;}
  .spin{font-family:"Rajdhani";letter-spacing:.1em;color:var(--volt);padding:24px 0;}
  @media (prefers-reduced-motion:reduce){ .run{animation:none;} .liv .d{animation:none;} .step,.scene,.aud{transition:none;opacity:1;transform:none;} }
</style>
</head>
<body>
<div id="bg">
  <div class="floods"></div>
  <svg viewBox="0 0 1100 520" preserveAspectRatio="xMidYMax meet">
    <defs>
      <pattern id="net" width="28" height="28" patternUnits="userSpaceOnUse">
        <path d="M0 0 L28 28 M28 0 L0 28" stroke="rgba(206,255,120,.30)" stroke-width="0.9"/>
      </pattern>
      <linearGradient id="post" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="rgba(255,255,255,.95)"/><stop offset="1" stop-color="rgba(255,255,255,.55)"/>
      </linearGradient>
      <radialGradient id="flood" cx="50%" cy="0%" r="75%">
        <stop offset="0" stop-color="rgba(198,255,46,.18)"/><stop offset="100%" stop-color="transparent"/>
      </radialGradient>
      <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>
    <ellipse cx="550" cy="30" rx="560" ry="330" fill="url(#flood)"/>
    <!-- net -->
    <polygon points="190,150 910,150 970,470 130,470" fill="url(#net)" opacity="0.7"/>
    <rect x="190" y="150" width="720" height="320" fill="url(#net)" opacity="0.5"/>
    <!-- goal frame -->
    <g filter="url(#glow)">
    <rect x="184" y="144" width="14" height="330" rx="3" fill="url(#post)"/>
    <rect x="902" y="144" width="14" height="330" rx="3" fill="url(#post)"/>
    <rect x="184" y="144" width="732" height="14" rx="3" fill="url(#post)"/>
    </g>
    <!-- pitch arc -->
    <path d="M 60 500 Q 550 430 1040 500" stroke="rgba(255,255,255,.12)" stroke-width="2" fill="none"/>
    <circle cx="550" cy="505" r="3" fill="rgba(255,255,255,.4)"/>
  </svg>
  <div class="grain"></div>
  <div class="vig"></div>
</div>

<div class="wrap">
  <div class="hero">
    <div class="crest">P</div>
    <div class="mark"><div class="t">PRAN&nbsp;FC</div><div class="s">FC CONTROL · SEASON 25/26</div></div>
    <div class="stats" id="stats"></div>
    <div class="liv"><span class="d"></span>LIVE · CLOUD</div>
  </div>

  <div class="feed">
    <div class="tag">LIVE FEED</div>
    <div class="track"><div class="run" id="feed"></div></div>
  </div>

  <div class="grid">
    <div class="panel">
      <div class="ph">SQUAD · WORK QUEUE <span class="n" id="qn"></span></div>
      <div class="scroll" id="queue"></div>
    </div>
    <div class="panel">
      <div class="ph">MATCH ACTIONS</div>
      <div class="scroll" style="padding:14px">
        <button class="play volt" id="b-sync"><div class="bt">Sync bank receipts</div>
          <div class="bd">turn unmatched incoming wires into work items</div></button>
        <button class="play volt" id="b-walk"><div class="bt">Walk a wire → posted</div>
          <div class="bd">new → proposed → ✋ denied → approved → posted</div></button>
        <button class="play red" id="b-fraud"><div class="bt">Fraud: bank-detail change</div>
          <div class="bd">lookalike domain → buy evidence → hold → CFO</div></button>
        <button class="play amber" id="b-addon"><div class="bt">Add-on dispute</div>
          <div class="bd">25 claimed · 24 league → reject w/ clause + match ids</div></button>
        <div class="ph" style="padding:16px 2px 10px;border:0">SQUAD · MODEL-PLAYED</div>
        <div class="squad"><b>sync</b> · <b>ai_agent</b> · <b>accountant</b> · <b>controller</b> · <b>CFO</b> · <b>gateway</b></div>
      </div>
    </div>
    <div class="panel">
      <div class="ph">REVIEW <span class="n">VAR</span></div>
      <div class="scroll rev"><div id="result"><div class="empty">
        <div class="big">Pick a move</div>
        Every decision runs live through the gateway on your cloud ledger —<br>and shows its card.
      </div></div></div>
    </div>
  </div>
</div>

<script>
const $=s=>document.querySelector(s), api=p=>fetch(p).then(r=>r.json());
const post=p=>fetch(p,{method:"POST"}).then(r=>r.json());
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let activeWi=null;
const POS=["GK","CB","RB","CM","AM","ST","LW","RW","DM"];
function money(n){ if(n==null) return "—"; const a=Math.abs(n);
  return (n<0?"-":"")+(a>=1e6?(a/1e6).toFixed(1)+"M":a>=1e3?(a/1e3).toFixed(0)+"k":a); }
function squadNo(id){ let h=0; for(const c of id) h=(h*31+c.charCodeAt(0))%97; return (h%98)+1; }
function pos(id){ let h=0; for(const c of id) h=(h*17+c.charCodeAt(0))%997; return POS[h%POS.length]; }

async function loadStats(){
  const m=await api("/api/metrics");
  const cash=Object.entries(m.cash).map(([c,v])=>`${c} ${money(v)}`).join("  ");
  $("#stats").innerHTML=`
   <div class="stat go"><div class="k">POSTED</div><div class="v">${String(m.posted||0).padStart(2,'0')}</div></div>
   <div class="stat hot"><div class="k">ON HOLD</div><div class="v">${String(m.held||0).padStart(2,'0')}</div></div>
   <div class="stat"><div class="k">PLANTED</div><div class="v">${m.planted_issues}</div></div>
   <div class="stat cash"><div class="k">CASH</div><div class="v cash">${cash||'—'}</div></div>
   <div class="stat"><div class="k">CALLS</div><div class="v">${m.audit_allowed}<small>/${m.audit_denied} dn</small></div></div>`;
}
async function loadFeed(){
  const f=await api("/api/feed");
  if(!f.length){ $("#feed").innerHTML='<span class="tk sub">no decisions yet — make a move</span>'; return; }
  const one=f.map(x=>`<span class="tk"><b class="${x.kind==='green'?'g':x.kind==='amber'?'a':'r'}">${x.label}</b> <span class="sub">· ${x.subject} · ${x.reason}</span></span>`).join("");
  $("#feed").innerHTML=one+one;
}
async function loadQueue(){
  const q=await api("/api/queue"); $("#qn").textContent=q.length;
  $("#queue").innerHTML=q.map(w=>`
    <div class="card ${w.id===activeWi?'active':''}" data-id="${w.id}">
      <div class="num"><span class="no">${squadNo(w.id)}</span><span class="ps">${pos(w.id)}</span></div>
      <div class="body"><div class="id">${w.id}</div>
        <div class="meta">${w.kind}${w.failing_check?' · <span style="color:var(--red)">✗ '+w.failing_check+'</span>':''}</div></div>
      <div class="rt"><div class="chip c-${w.state}">${w.state}</div>
        <div class="amt">${w.amount?money(w.amount)+' '+w.currency:''}</div></div>
    </div>`).join("");
  document.querySelectorAll(".card").forEach(e=>e.onclick=()=>showAudit(e.dataset.id));
}
function refresh(){ loadStats(); loadFeed(); loadQueue(); }
async function reveal(sel){ for(const n of document.querySelectorAll(sel)){ n.classList.add("show"); await sleep(105);} }
function setResult(h){ $("#result").innerHTML=h; }
function busy(l){ setResult(`<div class="spin">● ${l}…</div>`); }
function cardFor(r){ if(!r.allowed) return 'red'; return {post:'green',approve:'green',release:'green',reject:'red',hold:'red'}[r.action]||'amber'; }
function auditHTML(rows){ if(!rows||!rows.length) return '<div class="empty">no cards shown yet</div>';
  return rows.map(r=>`<div class="aud"><div class="rc rc-${cardFor(r)}" style="width:11px;height:15px"></div>
    <div class="t">${r.at}</div><div class="who">${r.actor}</div>
    <div class="did ${r.allowed?'ok':'deny'}">${r.allowed?'':'✗ '}${r.action}${r.state?' ['+r.state+']':''}</div>
    <div class="rsn">${(r.reason||'').slice(0,52)}</div></div>`).join(""); }
function stepsHTML(steps){ return steps.map(s=>`<div class="step">
   <div class="rc rc-${s.ok?(s.action==='propose'?'amber':'green'):'red'}"></div>
   <div class="ac">${s.actor} · ${s.action}</div>
   <div class="st">${s.ok?s.state:'🟥 RED CARD — '+(s.why||'')}</div></div>`).join(""); }
function scenesHTML(plan){ if(!plan||!plan.scenes||!plan.scenes.length) return '';
  return plan.scenes.map(sc=>`<div class="scene"><div class="say">${sc.say}</div>
    <div class="facts">${(sc.facts||[]).map(f=>f.key+'='+f.value).join('   ')}</div></div>`).join(""); }

async function showAudit(wi){ activeWi=wi; loadQueue();
  const rows=await api("/api/audit/"+wi);
  setResult(`<div class="badge">● VAR REVIEW</div><div class="rtitle">${wi}</div>
    <div class="lab">The ref's book · "why?" is one query</div>${auditHTML(rows)}`);
  await reveal("#result .aud"); }

$("#b-sync").onclick=async()=>{ busy("scouting the bank feed");
  const r=await post("/api/sim/sync");
  setResult(`<div class="badge">● SYNC</div><div class="rtitle">Scouting</div><div class="rhead">${r.message}</div>
    ${r.created.map(c=>`<div class="scene">signed → <b>${c}</b></div>`).join("")}`);
  await reveal("#result .scene"); refresh(); };

$("#b-walk").onclick=async()=>{ busy("walking a wire through the gateway");
  const r=await post("/api/sim/walk");
  if(r.detail){ setResult(`<div class="empty">${r.detail}</div>`); return; }
  activeWi=r.work_item;
  setResult(`<div class="badge">● VAR REVIEW</div><div class="rtitle">${r.work_item}</div>
    <div class="rhead">a wire walked new → posted — with a live separation-of-duties red card</div>
    <div class="lab">Play-by-play</div>${stepsHTML(r.steps)}
    <div class="lab">The ref's book</div>${auditHTML(r.audit)}`);
  await reveal("#result .step"); await reveal("#result .aud"); refresh(); };

async function moment(ep,label){ busy(label);
  const r=await post(ep); activeWi=r.work_item;
  setResult(`<div class="badge">● VAR REVIEW</div><div class="rtitle">${r.work_item}</div><div class="rhead">${r.headline}</div>
    <div class="lab">The analyst's read · grounded</div>${scenesHTML(r.explanation)}
    <div class="lab">The ref's book · denied attempts kept</div>${auditHTML(r.audit)}`);
  await reveal("#result .scene"); await reveal("#result .aud"); refresh(); }
$("#b-fraud").onclick=()=>moment("/api/sim/fraud","reviewing the bank-detail change");
$("#b-addon").onclick=()=>moment("/api/sim/addon","checking the add-on vs match data");

refresh();
const demo=new URLSearchParams(location.search).get("demo");
if(demo){ setTimeout(()=>({fraud:()=>$("#b-fraud").click(),addon:()=>$("#b-addon").click(),
  walk:()=>$("#b-walk").click(),sync:()=>$("#b-sync").click()}[demo]?.()),700); }
