<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pran FC — Transfer Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Saira:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
<style>
  :root{--volt:#c6ff2e;--cyan:#3fe3ff;--ink:#eef3f7;--dim:#8591a0;
        --turf:#2fe07a;--amber:#ffb23e;--red:#ff4d5e;
        --glass:rgba(9,13,19,.62);--brd:rgba(255,255,255,.09);}
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;overflow:hidden;}
  body{background:#05080c;color:var(--ink);font-family:"Saira",system-ui,sans-serif;font-size:14px;}
  .raj{font-family:"Rajdhani",sans-serif;text-transform:uppercase;letter-spacing:.04em;}
  .mono{font-family:"JetBrains Mono",monospace;font-variant-numeric:tabular-nums;}

  /* the real 3D match, playing as an ambient backdrop */
  #pitch{position:fixed;inset:0;width:100%;height:100%;border:0;z-index:0;pointer-events:none;}
  #scrim{position:fixed;inset:0;z-index:1;pointer-events:none;background:
    linear-gradient(180deg,rgba(5,8,12,.82) 0%,rgba(5,8,12,.2) 16%,rgba(5,8,12,.15) 70%,rgba(5,8,12,.75) 100%),
    radial-gradient(120% 80% at 50% 40%, transparent 55%, rgba(3,5,8,.7) 100%);}

  /* header */
  header{position:fixed;top:0;left:0;right:0;z-index:3;display:flex;align-items:center;gap:16px;
         padding:14px 22px;}
  .crest{width:40px;height:46px;display:flex;align-items:center;justify-content:center;
    font-family:"Rajdhani";font-weight:700;font-size:23px;color:#0a1004;
    background:linear-gradient(165deg,var(--volt),#8fce00);
    clip-path:polygon(50% 0,100% 16%,100% 60%,50% 100%,0 60%,0 16%);box-shadow:0 0 22px rgba(198,255,46,.35);}
  .mark .t{font-family:"Rajdhani";font-weight:700;font-size:22px;letter-spacing:.06em;line-height:1;}
  .mark .s{font-size:10.5px;letter-spacing:.3em;color:var(--volt);margin-top:4px;}
  .stats{margin-left:auto;display:flex;gap:9px;}
  .stat{padding:7px 15px;border-radius:11px;background:var(--glass);border:1px solid var(--brd);
        backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);min-width:86px;}
  .stat .k{font-family:"Rajdhani";font-size:10px;letter-spacing:.14em;color:var(--dim);}
  .stat .v{font-family:"JetBrains Mono";font-weight:700;font-size:19px;margin-top:2px;line-height:1;}
  .stat .v small{font-family:"Saira";font-size:10.5px;color:var(--dim);font-weight:500;}
  .stat.go .v{color:var(--volt);} .stat.hot .v{color:var(--red);} .stat.cash .v{font-size:12px;white-space:nowrap;}
  .liv{display:flex;align-items:center;gap:7px;font-family:"Rajdhani";font-size:11px;letter-spacing:.14em;color:var(--dim);margin-left:4px;}
  .liv .d{width:8px;height:8px;border-radius:50%;background:var(--volt);box-shadow:0 0 10px var(--volt);animation:p 2s infinite;}
  @keyframes p{50%{opacity:.4;}}

  /* floating glass panels */
  .panel{position:fixed;z-index:2;border-radius:16px;background:var(--glass);border:1px solid var(--brd);
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);display:flex;flex-direction:column;
    box-shadow:0 18px 60px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.05);overflow:hidden;}
  .left{left:18px;top:78px;bottom:18px;width:316px;}
  .right{right:18px;top:78px;bottom:18px;width:480px;}
  .ph{font-family:"Rajdhani";font-size:12px;letter-spacing:.14em;padding:14px 16px 11px;
      display:flex;justify-content:space-between;border-bottom:1px solid var(--brd);}
  .ph .n{color:var(--volt);} .scroll{overflow:auto;}

  /* queue cards */
  .card{display:flex;gap:11px;align-items:center;padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.05);cursor:pointer;transition:.12s;}
  .card:hover{background:rgba(255,255,255,.04);} .card.active{background:rgba(198,255,46,.08);box-shadow:inset 3px 0 0 var(--volt);}
  .num{width:34px;height:38px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-family:"Rajdhani";background:rgba(255,255,255,.05);border:1px solid var(--brd);
    clip-path:polygon(50% 0,100% 20%,100% 70%,50% 100%,0 70%,0 20%);}
  .num .no{font-weight:700;font-size:14px;line-height:1;} .num .ps{font-size:8px;color:var(--dim);}
  .card .body{flex:1;min-width:0;} .card .id{font-family:"JetBrains Mono";font-size:12px;}
  .card .meta{color:var(--dim);font-size:11.5px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .chip{font-family:"Rajdhani";font-size:9.5px;font-weight:700;letter-spacing:.06em;padding:2px 8px;border-radius:5px;white-space:nowrap;}
  .c-NEW{background:rgba(255,255,255,.07);color:#aeb9c6;} .c-PROPOSED{background:rgba(63,227,255,.14);color:var(--cyan);}
  .c-NEEDS_INFO{background:rgba(255,178,62,.16);color:var(--amber);} .c-APPROVED,.c-POSTED{background:rgba(47,224,122,.16);color:var(--turf);}
  .c-HELD{background:rgba(255,77,94,.16);color:var(--red);} .c-REJECTED{background:rgba(255,77,94,.13);color:#ff8a95;}
  .amt{font-family:"JetBrains Mono";font-size:12px;margin-top:4px;text-align:right;}

  /* actions dock (bottom-center, over the pitch) */
  .dock{position:fixed;z-index:2;left:350px;right:514px;bottom:18px;display:flex;gap:10px;}
  .play{flex:1;text-align:left;border-radius:12px;padding:11px 14px;cursor:pointer;color:var(--ink);font-family:inherit;
    background:var(--glass);border:1px solid var(--brd);border-top:2px solid rgba(255,255,255,.14);
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);transition:.14s;}
  .play:hover{transform:translateY(-2px);}
  .play .bt{font-family:"Rajdhani";font-size:13.5px;letter-spacing:.03em;font-weight:600;}
  .play .bd{color:var(--dim);font-size:11px;margin-top:3px;}
  .play.volt{border-top-color:var(--volt);} .play.red{border-top-color:var(--red);} .play.amber{border-top-color:var(--amber);}

  /* right: review */
  .rev{padding:18px 20px;}
  .badge{display:inline-flex;align-items:center;gap:7px;font-family:"Rajdhani";font-size:10.5px;letter-spacing:.2em;
    color:var(--volt);border:1px solid rgba(198,255,46,.3);background:rgba(198,255,46,.06);padding:4px 11px;border-radius:7px;}
  .rtitle{font-family:"Rajdhani";font-weight:700;font-size:23px;margin:12px 0 2px;}
  .rhead{color:var(--volt);font-size:13px;margin-bottom:16px;}
  .lab{font-family:"Rajdhani";font-size:10.5px;letter-spacing:.14em;color:var(--dim);margin:18px 0 9px;padding-bottom:6px;border-bottom:1px solid var(--brd);}
  .step,.aud{display:flex;gap:10px;align-items:baseline;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.05);opacity:0;transition:.24s;}
  .step{transform:translateX(-5px);} .step.show,.aud.show{opacity:1;transform:none;}
  .rc{width:11px;height:15px;border-radius:2px;flex:none;transform:rotate(-7deg);}
  .rc-green{background:var(--turf);} .rc-amber{background:var(--amber);} .rc-red{background:var(--red);}
  .step .ac,.aud .who{font-family:"Rajdhani";font-weight:600;min-width:150px;} .step .st,.aud .rsn{color:var(--dim);font-size:12.5px;}
  .aud .t{font-family:"JetBrains Mono";color:var(--dim);font-size:11.5px;min-width:58px;}
  .aud .did.ok{color:var(--turf);} .aud .did.deny{color:var(--red);}
  .scene{padding:10px 0;border-bottom:1px solid rgba(255,255,255,.05);opacity:0;transition:.24s;}
  .scene.show{opacity:1;} .scene .say::before{content:"▸ ";color:var(--volt);}
  .scene .facts{font-family:"JetBrains Mono";color:var(--dim);font-size:11.5px;margin-top:4px;}
  .empty{color:var(--dim);text-align:center;padding:16vh 12px;line-height:1.9;}
  .empty .big{font-family:"Rajdhani";font-weight:700;font-size:18px;color:var(--ink);margin-bottom:8px;}
  .spin{font-family:"Rajdhani";letter-spacing:.1em;color:var(--volt);padding:20px;}
</style>
</head>
<body>
  <iframe id="pitch" src="./pitch3d.html" title="pitch"></iframe>
  <div id="scrim"></div>

  <header>
    <div class="crest">P</div>
    <div class="mark"><div class="t">PRAN FC</div><div class="s">TRANSFER CONTROL</div></div>
    <div class="stats" id="stats"></div>
    <div class="liv"><span class="d"></span>LIVE</div>
  </header>

  <aside class="panel left">
    <div class="ph">SQUAD · WORK QUEUE <span class="n" id="qn"></span></div>
    <div class="scroll" id="queue"></div>
  </aside>

  <div class="dock">
    <button class="play volt" id="b-sync"><div class="bt">Sync receipts</div><div class="bd">wires → work items</div></button>
    <button class="play volt" id="b-walk"><div class="bt">Walk → posted</div><div class="bd">with a SoD red card</div></button>
    <button class="play red" id="b-fraud"><div class="bt">Fraud check</div><div class="bd">buy evidence → hold</div></button>
    <button class="play amber" id="b-addon"><div class="bt">Add-on dispute</div><div class="bd">vs match data</div></button>
  </div>

  <aside class="panel right">
    <div class="ph">REVIEW <span class="n">VAR</span></div>
    <div class="scroll rev"><div id="result"></div></div>
  </aside>

<script>
const API="http://localhost:4055/api";
const $=s=>document.querySelector(s), api=p=>fetch(API+p).then(r=>r.json()), post=p=>fetch(API+p,{method:"POST"}).then(r=>r.json());
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const POS=["GK","CB","RB","CM","AM","ST","LW","RW","DM"]; let activeWi=null;
function money(n){ if(n==null)return "—"; const a=Math.abs(n); return (n<0?"-":"")+(a>=1e6?(a/1e6).toFixed(1)+"M":a>=1e3?(a/1e3).toFixed(0)+"k":a); }
function sq(id){ let h=0; for(const c of id)h=(h*31+c.charCodeAt(0))%97; return (h%98)+1; }
function ps(id){ let h=0; for(const c of id)h=(h*17+c.charCodeAt(0))%997; return POS[h%POS.length]; }

async function loadStats(){ const m=await api("/metrics");
  const cash=Object.entries(m.cash).map(([c,v])=>`${c} ${money(v)}`).join(" ");
  $("#stats").innerHTML=`
   <div class="stat go"><div class="k">POSTED</div><div class="v">${String(m.posted||0).padStart(2,'0')}</div></div>
   <div class="stat hot"><div class="k">HELD</div><div class="v">${String(m.held||0).padStart(2,'0')}</div></div>
   <div class="stat"><div class="k">PLANTED</div><div class="v">${m.planted_issues}</div></div>
   <div class="stat cash"><div class="k">CASH</div><div class="v cash">${cash||'—'}</div></div>
   <div class="stat"><div class="k">CALLS</div><div class="v">${m.audit_allowed}<small>/${m.audit_denied}</small></div></div>`; }
async function loadQueue(){ const q=await api("/queue"); $("#qn").textContent=q.length;
  $("#queue").innerHTML=q.map(w=>`<div class="card ${w.id===activeWi?'active':''}" data-id="${w.id}">
    <div class="num"><span class="no">${sq(w.id)}</span><span class="ps">${ps(w.id)}</span></div>
    <div class="body"><div class="id">${w.id}</div><div class="meta">${w.kind}</div></div>
    <div><div class="chip c-${w.state}">${w.state}</div><div class="amt">${w.amount?money(w.amount)+' '+w.currency:''}</div></div>
  </div>`).join("");
  document.querySelectorAll(".card").forEach(e=>e.onclick=()=>showAudit(e.dataset.id)); }
function refresh(){ loadStats(); loadQueue(); if(!activeWi&&!$("#result").innerHTML) setResult(EMPTY); }
const EMPTY=`<div class="empty"><div class="big">Live over the pitch</div>Pick a move below — every decision
  runs through the gateway on your cloud ledger and shows its card.</div>`;
async function reveal(sel){ for(const n of document.querySelectorAll(sel)){ n.classList.add("show"); await sleep(100);} }
function setResult(h){ $("#result").innerHTML=h; } function busy(l){ setResult(`<div class="spin">● ${l}…</div>`); }
function cardFor(r){ if(!r.allowed)return 'red'; return {post:'green',approve:'green',release:'green',reject:'red',hold:'red'}[r.action]||'amber'; }
function auditHTML(rows){ if(!rows||!rows.length)return '<div class="empty">no cards yet</div>';
  return rows.map(r=>`<div class="aud"><div class="rc rc-${cardFor(r)}"></div><div class="t">${r.at}</div>
    <div class="who">${r.actor}</div><div class="did ${r.allowed?'ok':'deny'}">${r.allowed?'':'✗ '}${r.action}${r.state?' ['+r.state+']':''}</div>
    <div class="rsn">${(r.reason||'').slice(0,46)}</div></div>`).join(""); }
function stepsHTML(s){ return s.map(x=>`<div class="step"><div class="rc rc-${x.ok?(x.action==='propose'?'amber':'green'):'red'}"></div>
  <div class="ac">${x.actor} · ${x.action}</div><div class="st">${x.ok?x.state:'🟥 '+(x.why||'')}</div></div>`).join(""); }
function scenesHTML(p){ if(!p||!p.scenes)return ''; return p.scenes.map(sc=>`<div class="scene"><div class="say">${sc.say}</div>
  <div class="facts">${(sc.facts||[]).map(f=>f.key+'='+f.value).join('   ')}</div></div>`).join(""); }
async function showAudit(wi){ activeWi=wi; loadQueue(); const rows=await api("/audit/"+wi);
  setResult(`<div class="badge">● VAR</div><div class="rtitle">${wi}</div><div class="lab">the ref's book</div>${auditHTML(rows)}`);
  await reveal("#result .aud"); }
$("#b-sync").onclick=async()=>{ busy("scouting"); const r=await post("/sim/sync");
  setResult(`<div class="badge">● SYNC</div><div class="rtitle">Scouting</div><div class="rhead">${r.message}</div>
    ${r.created.map(c=>`<div class="scene">signed → <b>${c}</b></div>`).join("")}`); await reveal("#result .scene"); refresh(); };
$("#b-walk").onclick=async()=>{ busy("walking the gateway"); const r=await post("/sim/walk");
  if(r.detail){ setResult(`<div class="empty">${r.detail}</div>`);return; } activeWi=r.work_item;
  setResult(`<div class="badge">● VAR</div><div class="rtitle">${r.work_item}</div>
    <div class="rhead">new → posted, with a separation-of-duties red card</div>
    <div class="lab">play-by-play</div>${stepsHTML(r.steps)}<div class="lab">the ref's book</div>${auditHTML(r.audit)}`);
  await reveal("#result .step"); await reveal("#result .aud"); refresh(); };
async function moment(ep,l){ busy(l); const r=await post(ep); activeWi=r.work_item;
  setResult(`<div class="badge">● VAR</div><div class="rtitle">${r.work_item}</div><div class="rhead">${r.headline}</div>
    <div class="lab">the analyst's read</div>${scenesHTML(r.explanation)}<div class="lab">the ref's book</div>${auditHTML(r.audit)}`);
  await reveal("#result .scene"); await reveal("#result .aud"); refresh(); }
$("#b-fraud").onclick=()=>moment("/sim/fraud","reviewing the bank-detail change");
$("#b-addon").onclick=()=>moment("/sim/addon","checking the add-on vs match data");
refresh();
</script>
</body>
</html>
